<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartes de joueurs — LBMA 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #111;
      --AIGLES-bg:   #0a1f5e; --AIGLES-acc:   #f5c518;
      --CONDORS-bg:  #002d6b; --CONDORS-acc:  #4d9fff;
      --DUCS-bg:     #003d25; --DUCS-acc:     #6dff8a;
      --FAUCONS-bg:  #5a0000; --FAUCONS-acc:  #ff4444;
      --HARFANGS-bg: #0b2a50; --HARFANGS-acc: #8fd4ff;
      --VAUTOURS-bg: #240040; --VAUTOURS-acc: #cc77ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: 'Oswald', sans-serif;
      min-height: 100vh;
      color: #fff;
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 16px 60px;
    }

    /* Header */
    .header { text-align: center; margin-bottom: 28px; }
    .header-surtitle { font-size: 10px; letter-spacing: 5px; color: #555; text-transform: uppercase; margin-bottom: 4px; }
    .header-title { font-family: 'Bebas Neue', cursive; font-size: 38px; letter-spacing: 4px; line-height: 1; }
    .header-subtitle { font-size: 10px; color: #444; letter-spacing: 3px; margin-top: 3px; }

    /* Tabs */
    .team-tabs { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; max-width: 480px; margin-bottom: 18px; }
    .team-btn {
      padding: 6px 14px; border-radius: 5px; cursor: pointer;
      font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px;
      border: 1px solid #333; background: #1e1e1e; color: #666; transition: all .2s;
    }
    .team-btn.active { border-color: var(--acc); background: var(--acc); color: var(--bgc); }

    /* Chips */
    .player-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 480px; margin-bottom: 22px; min-height: 34px; }
    .player-chip {
      padding: 5px 11px; border-radius: 4px; cursor: pointer;
      font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      border: 1px solid #2a2a2a; background: #1a1a1a; color: #777; transition: all .15s;
    }
    .player-chip.active { background: #2d2d2d; color: #ddd; border-color: #555; }

    /* Card */
    .card-stage { perspective: 1300px; width: 300px; height: 460px; }
    .card-inner {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform .65s cubic-bezier(.4,.2,.2,1);
      cursor: pointer;
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 13px; overflow: hidden;
    }
    .card-back-face { transform: rotateY(180deg); }

    /* Recto */
    .front-header {
      padding: 7px 14px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .front-header span { font-size: 10px; font-weight: 700; letter-spacing: 2px; }

    .front-art {
      height: 185px; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    /* Photo mode */
    .front-art .player-photo {
      width: 100%; height: 100%; object-fit: cover; object-position: top center;
      display: block;
    }
    .front-art .photo-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,.65) 100%);
    }
    /* No-photo mode */
    .front-art .mascot-wrap { text-align: center; z-index: 1; }
    .front-art .mascot { font-size: 88px; filter: drop-shadow(0 4px 14px rgba(0,0,0,.6)); }
    .front-art .equipe-label {
      font-size: 10px; font-weight: 700; letter-spacing: 4px; opacity: .85; margin-top: 6px;
    }
    .front-art .bg-number {
      position: absolute; font-family: 'Bebas Neue', cursive;
      font-size: 200px; opacity: .06; line-height: 1; bottom: -20px; right: -10px;
    }
    .front-art .corner-num {
      position: absolute; top: 10px; left: 14px; z-index: 2;
      font-family: 'Bebas Neue', cursive; font-size: 32px; line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }
    /* Photo label overlay (team name on photo) */
    .front-art .photo-team-label {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-size: 10px; font-weight: 700; letter-spacing: 4px; z-index: 2;
      text-shadow: 0 1px 4px rgba(0,0,0,.9); white-space: nowrap;
    }

    .front-name { padding: 10px 16px 6px; flex-shrink: 0; }
    .front-name .nom { font-family: 'Bebas Neue', cursive; font-size: 24px; letter-spacing: 1px; line-height: 1.1; color: #fff; }
    .front-name .pos { font-size: 11px; letter-spacing: 2px; font-weight: 600; margin-top: 2px; }

    .front-mini {
      margin: 0 12px 10px; border-radius: 8px; padding: 8px 4px;
      display: flex; justify-content: space-around; flex-shrink: 0;
    }
    .mini-stat { text-align: center; }
    .mini-stat .val { font-family: 'Bebas Neue', cursive; font-size: 18px; color: #fff; line-height: 1; }
    .mini-stat .lbl { font-size: 9px; letter-spacing: 1px; font-weight: 600; margin-top: 1px; }

    .front-footer {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .front-footer span { font-size: 8px; letter-spacing: 1px; }

    /* Verso */
    .back-header {
      padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .back-header .info .name { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
    .back-header .info .sub  { font-size: 9px; letter-spacing: 2px; margin-top: 1px; }
    .back-header .mascot-sm  { font-size: 26px; }

    /* Photo thumbnail on back */
    .back-photo-thumb {
      width: 52px; height: 52px; border-radius: 6px; object-fit: cover;
      object-position: top; border: 2px solid rgba(255,255,255,.2); flex-shrink: 0;
    }
    .back-photo-placeholder {
      width: 52px; height: 52px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0; border: 2px solid rgba(255,255,255,.15);
    }

    .back-bio {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: rgba(0,0,0,.12);
      margin: 8px 10px 6px; border-radius: 6px; overflow: hidden; flex-shrink: 0;
    }
    .bio-cell {
      background: #fff; padding: 4px 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .bio-cell .bio-lbl { font-size: 8px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
    .bio-cell .bio-val { font-size: 10px; font-weight: 700; }

    /* Note bio */
    .back-note {
      margin: 0 10px 6px; border-radius: 6px; padding: 7px 10px;
      font-size: 10px; line-height: 1.5; font-family: 'Oswald', sans-serif;
      font-weight: 400; font-style: italic; flex-shrink: 0;
      min-height: 36px;
    }
    .back-note.empty { display: none; }

    .back-stats { margin: 0 10px; border-radius: 7px; overflow: hidden; flex-shrink: 0; border: 1px solid rgba(0,0,0,.15); }
    .stats-head, .stats-row, .stats-head2, .stats-row2 { display: grid; padding: 4px 8px; }
    .stats-head  { grid-template-columns: repeat(7,1fr); }
    .stats-row   { grid-template-columns: repeat(7,1fr); background: #fff; }
    .stats-head2 { grid-template-columns: repeat(5,1fr); }
    .stats-row2  { grid-template-columns: repeat(5,1fr); background: #f8f8f8; }
    .stats-head span, .stats-head2 span { font-size: 8px; text-align: center; font-weight: 700; letter-spacing: .4px; }
    .stats-row span, .stats-row2 span  { font-family:'Bebas Neue',cursive; font-size:14px; text-align:center; line-height:1.3; }

    .back-footer {
      margin: 6px 10px 0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .back-footer span { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
    .back-footer .badge { font-size: 9px; padding: 2px 7px; border-radius: 4px; font-weight: 700; letter-spacing: 1px; }

    .hint { margin-top: 14px; font-size: 10px; color: #444; letter-spacing: 2px; text-transform: uppercase; }
    .loading { color: #555; font-size: 13px; letter-spacing: 2px; margin: 40px 0; }

    @media (max-width: 360px) {
      .card-stage { width: 272px; height: 440px; }
      .front-art { height: 165px; }
      .front-art .mascot { font-size: 70px; }
    }
    @media print {
      body { background: white; padding: 0; }
      .team-tabs, .player-chips, .hint, .header-surtitle, .header-subtitle { display: none !important; }
      .card-stage { margin: 0 auto; }
      .card-inner { transform: none !important; }
      .card-face.card-back-face { display: none; }
      a[href], button { display: none !important; }
    }
  </style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:480px;margin-bottom:16px">
  <a href="index.html" style="font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;color:#555;text-decoration:none;border:1px solid #333;padding:5px 12px;border-radius:4px;transition:.2s" onmouseover="this.style.color='#fff';this.style.background='#333'" onmouseout="this.style.color='#555';this.style.background='transparent'">← Retour au site</a>
  <button onclick="window.print()" style="font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;color:#555;background:transparent;border:1px solid #333;padding:5px 12px;border-radius:4px;cursor:pointer;transition:.2s" onmouseover="this.style.color='#fff';this.style.background='#333'" onmouseout="this.style.color='#555';this.style.background='transparent'">🖨️ Imprimer</button>
</div>

<div class="header">
  <div class="header-surtitle">Ligue de Balle Molle Amicale</div>
  <div class="header-title">CARTES DE JOUEURS</div>
  <div class="header-subtitle">SAISON 2026 &bull; EST. 1976</div>
</div>

<div class="team-tabs"   id="teamTabs"></div>
<div class="player-chips" id="playerChips"></div>

<div id="loadingMsg" class="loading">Chargement des données…</div>

<div class="card-stage" id="cardStage" style="display:none">
  <div class="card-inner" id="cardInner">
    <div class="card-face"           id="cardFront"></div>
    <div class="card-face card-back-face" id="cardBack"></div>
  </div>
</div>

<div class="hint" id="hint" style="display:none">Touchez la carte pour voir les stats</div>

<button id="printBtn" onclick="printCard()" style="display:none;margin-top:14px;padding:8px 20px;background:#1E3A5F;color:white;border:none;border-radius:5px;font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;">🖨️ IMPRIMER CETTE CARTE</button>


<script>
const SUPABASE_URL  = 'https://xgyskiatppgaeaamjhxr.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhneXNraWF0cHBnYWVhYW1qaHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTgxNTQsImV4cCI6MjA4NjA3NDE1NH0.67KCcUWlJij-scDoCUvZpkiCle5-mHVmy-inRk96Tac';

const TEAMS = {
  AIGLES:   { bg:'#0a1f5e', acc:'#f5c518', light:'#e5eaff', mascot:'🦅' },
  CONDORS:  { bg:'#002d6b', acc:'#4d9fff', light:'#ddeeff', mascot:'🦅' },
  DUCS:     { bg:'#003d25', acc:'#6dff8a', light:'#e6ffed', mascot:'🦆' },
  FAUCONS:  { bg:'#5a0000', acc:'#ff4444', light:'#fff0f0', mascot:'🦅' },
  HARFANGS: { bg:'#0b2a50', acc:'#8fd4ff', light:'#e8f5ff', mascot:'🦉' },
  VAUTOURS: { bg:'#240040', acc:'#cc77ff', light:'#f4eeff', mascot:'🦅' },
};
const TEAM_ORDER = ['AIGLES','CONDORS','DUCS','FAUCONS','HARFANGS','VAUTOURS'];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let allPlayers   = [];
let currentTeam  = 'AIGLES';
let currentPlayer = null;
let flipped = false;

/* ── Fetch ── */

/* ── Pagination carrière (même logique que frappeurs-carriere.html) ── */
async function fetchAllCareerBat() {
  const rows = [];
  let offset = 0;
  const batch = 1000;
  while (true) {
    const url = `${SUPABASE_URL}/rest/v1/frappeurs_saison?select=nom,saison,pj,ab,cs,pp,rb,pc&limit=${batch}&offset=${offset}`;
    const r = await fetch(url, { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } });
    const chunk = await r.json();
    rows.push(...chunk);
    if (chunk.length < batch) break;
    offset += batch;
  }
  return { data: rows, error: null };
}
async function fetchAllCareerPit() {
  const rows = [];
  let offset = 0;
  const batch = 1000;
  while (true) {
    const url = `${SUPABASE_URL}/rest/v1/lanceurs_saison?select=nom,saison,pl,v,d&limit=${batch}&offset=${offset}`;
    const r = await fetch(url, { headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` } });
    const chunk = await r.json();
    rows.push(...chunk);
    if (chunk.length < batch) break;
    offset += batch;
  }
  return { data: rows, error: null };
}

async function fetchPlayers() {
  const [{ data: stats }, { data: joueurs }, { data: picks }, { data: carBat }, { data: carPit }, { data: pit26 }] = await Promise.all([
    sb.from('frappeurs_saison')
      .select('nom,equipe,pj,ab,cs,simples,doubles,triples,cc,pc,pp,rb,bb,sac,moy')
      .eq('saison','2026').gt('ab',0).order('nom'),
    sb.from('joueurs_liste')
      .select('nom,ville,naissance,photo_url,note_bio,numero_chandail,position')
      .eq('saison','2026'),
    sb.from('repechage_picks')
      .select('joueur_nom,equipe')
      .eq('saison','2026'),
    fetchAllCareerBat(),
    fetchAllCareerPit(),
    sb.from('lanceurs_saison').select('nom,pl,v,d,moy').eq('saison','2026')
  ]);

  // Équipe officielle par joueur (depuis repechage_picks = assignation du repêchage)
  const eqMap = {};
  (picks||[]).forEach(e => {
    if (e.joueur_nom) eqMap[e.joueur_nom.trim().toUpperCase()] = e.equipe.trim().toUpperCase();
  });

  // Bio par joueur
  const jMap = {};
  (joueurs||[]).forEach(j => { jMap[j.nom.trim().toUpperCase()] = j; });

  const carBatMap = {};
  (carBat||[]).forEach(r => {
    const k = r.nom.trim().toUpperCase();
    if (!carBatMap[k]) carBatMap[k] = { saisons:new Set(), pj:0, ab:0, cs:0, pp:0, pc:0 };
    carBatMap[k].saisons.add(r.saison);
    carBatMap[k].pj+=(r.pj||0); carBatMap[k].ab+=(r.ab||0);
    carBatMap[k].cs+=(r.cs||0); carBatMap[k].pp+=(r.pp||r.rb||0); carBatMap[k].pc+=(r.pc||0);
  });
  const carPitMap = {};
  (carPit||[]).forEach(r => {
    const k = r.nom.trim().toUpperCase();
    if (!carPitMap[k]) carPitMap[k] = { pl:0, v:0, d:0 };
    carPitMap[k].pl+=(r.pl||0); carPitMap[k].v+=(r.v||0); carPitMap[k].d+=(r.d||0);
  });
  // Lanceurs 2026
  const pit26Map = {};
  (pit26||[]).forEach(r => {
    const k = r.nom.trim().toUpperCase();
    pit26Map[k] = { pl: r.pl||0, v: r.v||0, d: r.d||0, moy: r.moy||0 };
  });

  // Agréger les stats de toutes les équipes (remplaçants inclus)
  const statsMap = {};
  (stats||[]).forEach(p => {
    const key = p.nom.trim().toUpperCase();
    if (!statsMap[key]) {
      statsMap[key] = { nom:p.nom, pj:0, ab:0, cs:0, simples:0, doubles:0, triples:0, cc:0, pc:0, pp:0, rb:0, bb:0, sac:0 };
    }
    const s = statsMap[key];
    s.pj       += (p.pj       || 0);
    s.ab       += (p.ab       || 0);
    s.cs       += (p.cs       || 0);
    s.simples  += (p.simples  || 0);
    s.doubles  += (p.doubles  || 0);
    s.triples  += (p.triples  || 0);
    s.cc       += (p.cc       || 0);
    s.pc       += (p.pc       || 0);
    s.pp       += (p.pp || p.rb || 0);
    s.rb       += (p.rb       || 0);
    s.bb       += (p.bb       || 0);
    s.sac      += (p.sac      || 0);
  });

  // Recalculer la moyenne
  Object.values(statsMap).forEach(s => {
    s.moy = s.ab > 0 ? (s.cs / s.ab) : 0;
  });

  // Construire la liste finale avec équipe officielle seulement
  allPlayers = Object.entries(statsMap).map(([key, s]) => {
    const officialTeam = eqMap[key] || '';
    const jl = jMap[key] || {};
    return {
      ...s,
      equipe:          officialTeam,
      ville:           jl.ville            || '',
      naissance:       jl.naissance        || '',
      photo_url:       jl.photo_url        || '',
      note_bio:        jl.note_bio         || '',
      numero_chandail: jl.numero_chandail  || null,
      position:  jl.position || 'Frappeur',
      car_saisons: carBatMap[key] ? carBatMap[key].saisons.size : 0,
      car_pj: carBatMap[key] ? carBatMap[key].pj : 0,
      car_ab: carBatMap[key] ? carBatMap[key].ab : 0,
      car_cs: carBatMap[key] ? carBatMap[key].cs : 0,
      car_pp: carBatMap[key] ? carBatMap[key].pp : 0,
      car_pc: carBatMap[key] ? carBatMap[key].pc : 0,
      car_pl: carPitMap[key] ? carPitMap[key].pl : 0,
      car_v:  carPitMap[key] ? carPitMap[key].v  : 0,
      car_d:  carPitMap[key] ? carPitMap[key].d  : 0,
      pit26:  pit26Map[key] || null,
    };
  })
  .filter(p => p.equipe && TEAMS[p.equipe])
  .sort((a,b) => a.equipe.localeCompare(b.equipe) || a.nom.localeCompare(b.nom));

  document.getElementById('loadingMsg').style.display  = 'none';
  document.getElementById('cardStage').style.display   = 'block';
  document.getElementById('hint').style.display        = 'block';
  document.getElementById('printBtn').style.display    = 'inline-block';

  buildTeamTabs();

  // Auto-sélection via paramètres URL (?joueur=NOM&equipe=EQUIPE)
  const params  = new URLSearchParams(window.location.search);
  const pJoueur = params.get('joueur') ? params.get('joueur').trim().toUpperCase() : null;
  const pEquipe = params.get('equipe') ? params.get('equipe').trim().toUpperCase() : null;

  if (pEquipe && TEAMS[pEquipe]) {
    setTeam(pEquipe);
    if (pJoueur) {
      const found = allPlayers.find(p => p.nom.trim().toUpperCase() === pJoueur && p.equipe === pEquipe);
      if (found) setPlayer(found);
    }
  } else {
    setTeam('AIGLES');
  }
}

/* ── Team tabs ── */
function buildTeamTabs() {
  const el = document.getElementById('teamTabs');
  el.innerHTML = '';
  TEAM_ORDER.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'team-btn';
    btn.textContent = TEAMS[t].mascot + ' ' + t;
    btn.style.setProperty('--acc',  TEAMS[t].acc);
    btn.style.setProperty('--bgc',  TEAMS[t].bg);
    btn.onclick = () => setTeam(t);
    btn.id = 'tb-' + t;
    el.appendChild(btn);
  });
}

function setTeam(t) {
  currentTeam = t; flipped = false;
  document.getElementById('cardInner').classList.remove('flipped');
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
  const tb = document.getElementById('tb-' + t);
  if (tb) tb.classList.add('active');
  const list = allPlayers.filter(p => p.equipe === t);
  buildChips(list);
  if (list.length) setPlayer(list[0]);
}

/* ── Chips ── */
function buildChips(players) {
  const el = document.getElementById('playerChips');
  el.innerHTML = '';
  players.forEach(p => {
    const c = document.createElement('button');
    c.className   = 'player-chip';
    c.textContent = shortName(p.nom);
    c.id          = 'cp-' + sid(p.nom);
    c.onclick     = () => { flipped=false; document.getElementById('cardInner').classList.remove('flipped'); setPlayer(p); };
    el.appendChild(c);
  });
}

function setPlayer(p) {
  currentPlayer = p;
  document.querySelectorAll('.player-chip').forEach(c => c.classList.remove('active'));
  const cp = document.getElementById('cp-' + sid(p.nom));
  if (cp) cp.classList.add('active');
  renderCard(p);
}

/* ── Render ── */
function renderCard(p) {
  const t   = TEAMS[p.equipe] || TEAMS.AIGLES;
  const moy = p.moy ? parseFloat(p.moy).toFixed(3).replace(/^0\./,'.') : '.000';
  const hasPhoto = p.photo_url && p.photo_url.trim() !== '';

  const numStr = p.numero_chandail ? '#' + p.numero_chandail : '';

  /* --- RECTO --- */
  const artHTML = hasPhoto
    ? `<img class="player-photo" src="${esc(p.photo_url)}" alt="${esc(p.nom)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
       <div class="photo-overlay"></div>

/* ── Helpers ── */
function miniStat(v,l,acc) {
  return `<div class="mini-stat"><div class="val">${v}</div><div class="lbl" style="color:${acc}">${l}</div></div>`;
}
function bc(lbl,val,col) {
  return `<div class="bio-cell"><span class="bio-lbl">${lbl}</span><span class="bio-val" style="color:${col}">${val}</span></div>`;
}
function getAge(naiss) {
  if (!naiss) return '';
  const m = naiss.match(/\d{4}/);
  return m ? (2026 - parseInt(m[0])) + ' ans' : '';
}
function shortName(nom) {
  const p = nom.trim().split(' ');
  return p.length < 2 ? nom : p[0] + ' ' + p.slice(1).map(x=>x[0]).join('.')+'.';
}
function sid(nom) { return nom.replace(/[^a-zA-ZÀ-ÿ0-9]/g,'_'); }
function esc(s)   { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function dk(hex) {
  const n = parseInt(hex.replace('#',''),16);
  const r = Math.max(0,(n>>16)-25), g = Math.max(0,((n>>8)&0xff)-25), b = Math.max(0,(n&0xff)-25);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
