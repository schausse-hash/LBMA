<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic Benchage — LBMA</title>
<style>
body{font-family:Consolas,monospace;background:#111;color:#eee;padding:1.5rem;font-size:14px;line-height:1.6}
h1{color:#D4AF37;font-size:1.2rem;margin-bottom:1rem}
.ok{color:#6fcf97}.err{color:#eb5757}.info{color:#8ecae6}.warn{color:#f2c94c}
#log div{border-bottom:1px solid #222;padding:.2rem 0}
table{border-collapse:collapse;margin-top:1rem}
td,th{border:1px solid #444;padding:.3rem .6rem}
</style>
</head>
<body>
<h1>🔬 Diagnostic Benchage LBMA — v1</h1>
<div id="log"></div>
<div id="result"></div>
<script>
const L=document.getElementById('log');
function log(msg,cls){const d=document.createElement('div');d.className=cls||'info';d.textContent=new Date().toLocaleTimeString('fr-CA')+' — '+msg;L.appendChild(d);}
function ok(m){log('✅ '+m,'ok')} function err(m){log('❌ '+m,'err')} function warn(m){log('⚠️ '+m,'warn')}

const SB='https://xgyskiatppgaeaamjhxr.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhneXNraWF0cHBnYWVhYW1qaHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTgxNTQsImV4cCI6MjA4NjA3NDE1NH0.67KCcUWlJij-scDoCUvZpkiCle5-mHVmy-inRk96Tac';

async function timedFetch(label,url,opts){
    const t0=performance.now();
    const ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(),15000);
    try{
        const r=await fetch(url,Object.assign({signal:ctl.signal},opts||{}));
        const ms=Math.round(performance.now()-t0);
        const txt=await r.text();
        ok(label+' → HTTP '+r.status+' en '+ms+' ms ('+txt.length+' octets)');
        return txt;
    }catch(e){
        const ms=Math.round(performance.now()-t0);
        err(label+' → ÉCHEC après '+ms+' ms : '+(e.name==='AbortError'?'délai dépassé (15s)':e.message));
        return null;
    }finally{clearTimeout(to);}
}

(async()=>{
    log('=== 1. Environnement ===');
    log('URL: '+location.href);
    log('Navigateur: '+navigator.userAgent.slice(0,110));

    log('=== 2. Stockage ===');
    try{const s=localStorage.getItem('lbma_admin_session');
        if(!s){warn('localStorage: PAS de session admin (lbma_admin_session absent)');}
        else{try{const j=JSON.parse(s);ok('Session admin: '+(j.user||'?')+' / role='+(j.role||'?')+' / expire '+(j.expires?new Date(j.expires).toLocaleString('fr-CA'):'?')+(j.expires<Date.now()?' — EXPIRÉE!':' — valide'));}catch(e){err('Session admin illisible: '+e.message);}}
    }catch(e){err('localStorage inaccessible: '+e.message);}
    try{sessionStorage.setItem('_diag_t','1');
        if(sessionStorage.getItem('_diag_t')==='1'){ok('sessionStorage: fonctionne');}else{err('sessionStorage: écrit mais relit mal');}
    }catch(e){err('sessionStorage inaccessible: '+e.message);}

    log('=== 3. Service worker ===');
    try{
        log('controller: '+(navigator.serviceWorker&&navigator.serviceWorker.controller?('ACTIF → '+navigator.serviceWorker.controller.scriptURL+' ('+navigator.serviceWorker.controller.state+')'):'aucun (page non contrôlée)'));
        const t0=performance.now();
        const regs=await Promise.race([navigator.serviceWorker.getRegistrations(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('getRegistrations bloqué >5s')),5000))]);
        ok('getRegistrations en '+Math.round(performance.now()-t0)+' ms → '+regs.length+' inscription(s)');
        regs.forEach(r=>log('  inscription: scope='+r.scope+' active='+(r.active?r.active.state:'-')+' waiting='+(r.waiting?r.waiting.state:'-')+' installing='+(r.installing?r.installing.state:'-')));
    }catch(e){err('service worker: '+e.message);}
    try{const ks=await caches.keys();log('caches locaux: '+(ks.length?ks.join(', '):'aucun'));}catch(e){warn('caches inaccessibles: '+e.message);}

    log('=== 4. Requêtes réseau chronométrées ===');
    await timedFetch('Vercel (sw.js du site)','/sw.js?diag='+Math.random());
    const hdrs={headers:{'apikey':SK,'Authorization':'Bearer '+SK}};
    await timedFetch('Supabase saison_info',SB+'/rest/v1/saison_info?cle=eq.saison_active&select=valeur&limit=1',hdrs);
    const data=await timedFetch('Supabase benchage_saison',SB+'/rest/v1/benchage_saison?saison=eq.2026&select=equipe,joueur,off,def,bench&order=equipe.asc,bench.desc,joueur.asc',hdrs);

    log('=== 5. Résultat ===');
    if(data){
        try{
            const rows=JSON.parse(data);
            ok(rows.length+' joueurs reçus — construction du tableau…');
            const teams={};rows.forEach(p=>{(teams[p.equipe]=teams[p.equipe]||[]).push(p);});
            let html='<table><tr><th>Équipe</th><th>Joueurs</th><th>Min</th><th>Max</th><th>Écart</th></tr>';
            Object.keys(teams).sort().forEach(eq=>{
                const b=teams[eq].map(p=>p.bench);
                const mn=Math.min(...b),mx=Math.max(...b);
                html+='<tr><td>'+eq+'</td><td>'+b.length+'</td><td>'+mn+'</td><td>'+mx+'</td><td style="color:'+(mx-mn>1?'#eb5757':'#6fcf97')+'">'+(mx-mn)+'</td></tr>';
            });
            html+='</table>';
            document.getElementById('result').innerHTML=html;
            ok('DIAGNOSTIC TERMINÉ — tout fonctionne de ce côté.');
        }catch(e){err('JSON illisible: '+e.message);}
    }else{
        err('DIAGNOSTIC TERMINÉ — la requête Supabase échoue depuis cette page (voir ci-dessus).');
    }
})();
</script>
</body>
</html>
