<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ Benchage — LBMA</title>
    <link rel="icon" type="image/jpeg" href="logo-lbma.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#1E3A5F;--gold:#D4AF37;--dark:#1A1A1A;--white:#FDFBF7;--danger:#dc3545;--warning:#ffc107}
        body{font-family:'Work Sans',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
        .header{background:linear-gradient(135deg,var(--primary),#0d2137);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;border-bottom:3px solid var(--gold)}
        .header-left{display:flex;align-items:center;gap:1rem}
        .header img{height:48px;background:white;padding:3px;border-radius:5px}
        .header h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:.1em;color:var(--gold)}
        .user-badge{font-family:'Oswald',sans-serif;font-size:.85rem;color:var(--gold);opacity:.8}
        .btn-back{border:1px solid rgba(255,255,255,.3);color:var(--white);padding:.4rem .8rem;font-family:'Oswald',sans-serif;font-size:.8rem;text-decoration:none;display:inline-block}
        .btn-back:hover{border-color:var(--gold);color:var(--gold)}
        .main{padding:1.5rem;max-width:1400px;margin:0 auto}
        .toolbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;background:var(--primary);padding:1rem 1.5rem;border:1px solid var(--gold)}
        .toolbar label{font-family:'Oswald',sans-serif;font-size:.85rem;text-transform:uppercase}
        .toolbar select{padding:.6rem .8rem;border:2px solid var(--gold);background:var(--dark);color:white;font-size:.9rem}
        .btn-refresh{background:var(--gold);color:var(--dark);border:none;padding:.6rem 1.2rem;font-family:'Oswald',sans-serif;font-size:.9rem;cursor:pointer}
        .btn-refresh:hover{background:#c9a227}
        .auto-badge{font-size:.75rem;opacity:.6;margin-left:auto}
        #alertBar{display:none;background:rgba(220,53,69,.15);border:2px solid var(--danger);padding:1rem 1.5rem;margin-bottom:1.5rem}
        #alertBar h3{font-family:'Oswald',sans-serif;color:var(--danger);margin-bottom:.5rem}
        #alertBar ul{list-style:none;font-size:.9rem}
        #alertBar ul li{padding:.2rem 0}
        #alertBar ul li::before{content:'⚠️ ';margin-right:.3rem}
        .teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:1.5rem}
        .team-card{background:#222;border:2px solid var(--primary);overflow:hidden}
        .team-card.my-team{border-color:var(--gold)}
        .team-header{background:var(--primary);padding:.8rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
        .team-header h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.05em}
        .team-meta{font-size:.8rem;opacity:.7}
        .team-alert-bar{background:rgba(220,53,69,.2);border-bottom:2px solid var(--danger);padding:.5rem 1rem;font-size:.8rem;color:#f8d7da;display:none}
        .bench-table{width:100%;border-collapse:collapse}
        .bench-table th{background:rgba(30,58,95,.8);color:var(--gold);padding:.6rem .8rem;font-family:'Oswald',sans-serif;font-size:.75rem;text-transform:uppercase;text-align:center}
        .bench-table th:nth-child(2){text-align:left}
        .bench-table td{padding:.6rem .8rem;border-bottom:1px solid rgba(255,255,255,.06);font-size:.9rem;text-align:center}
        .bench-table td:first-child{color:var(--gold);font-family:'Oswald',sans-serif;font-weight:700}
        .bench-table td:nth-child(2){text-align:left;font-weight:600}
        .bench-table tr:last-child td{border-bottom:none}
        .bench-table tr:hover td{background:rgba(255,255,255,.04)}
        .pill{display:inline-block;padding:.25rem .7rem;border-radius:20px;font-size:.75rem;font-family:'Oswald',sans-serif;font-weight:600;white-space:nowrap}
        .pill-green{background:rgba(40,167,69,.2);color:#6fcf97;border:1px solid rgba(40,167,69,.4)}
        .pill-yellow{background:rgba(255,193,7,.15);color:#f2c94c;border:1px solid rgba(255,193,7,.35)}
        .pill-red{background:rgba(220,53,69,.2);color:#eb5757;border:1px solid rgba(220,53,69,.4)}
        .bench-bar-wrap{display:flex;align-items:center;gap:.5rem;justify-content:center}
        .bench-total{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;min-width:24px}
        .bench-dots{display:flex;gap:3px;flex-wrap:wrap;max-width:120px}
        .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
        .dot.off{background:#f2c94c}
        .dot.def{background:#6fcf97}
        .legend{display:flex;gap:1.5rem;flex-wrap:wrap;padding:.8rem 1.2rem;background:rgba(255,255,255,.04);font-size:.78rem;border-top:1px solid rgba(255,255,255,.08)}
        .leg-item{display:flex;align-items:center;gap:.4rem;opacity:.8}
        .loading{text-align:center;padding:3rem;opacity:.5;font-family:'Oswald',sans-serif}
        .spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(212,175,55,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:600px){.teams-grid{grid-template-columns:1fr}.header h1{font-size:1.3rem}}
    </style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <a href="admin.html"><img src="logo-lbma.jpg" alt="LBMA" onerror="this.style.display='none'"></a>
        <h1>⚖️ Gestion du Benchage</h1>
    </div>
    <div style="display:flex;align-items:center;gap:1rem">
        <span class="user-badge" id="userBadge"></span>
        <a class="btn-back" href="admin.html">← Admin</a>
    </div>
</div>
<div class="main">
    <div class="toolbar">
        <label>Saison</label>
        <select id="saisonSel" onchange="loadData()"><option>Chargement…</option></select>
        <label style="margin-left:1rem">Équipe</label>
        <select id="equipeSel" onchange="renderAll()"><option value="all">Toutes les équipes</option></select>
        <button class="btn-refresh" onclick="loadData()">🔄 Actualiser</button>
        <span class="auto-badge" id="lastUpdate"></span>
    </div>
    <div style="background:rgba(30,58,95,.4);border-left:4px solid var(--gold);padding:.75rem 1.2rem;margin-bottom:1rem;font-size:.82rem;opacity:.85">
        <strong style="font-family:'Oswald',sans-serif;color:var(--gold)">RÈGLE :</strong>
        L'écart de benchage entre joueurs ne doit jamais dépasser <strong>1</strong>.
        Cet outil est informatif — le marquage dans Stats Live ne vérifie pas automatiquement la rotation.
    </div>
    <div id="alertBar">
        <h3>🚨 🚨 Violation détectée — Écart &gt; 1 (défaite automatique si non corrigé)</h3>
        <ul id="alertList"></ul>
    </div>
    <div id="loadingDiv" class="loading"><div class="spinner"></div><br>Chargement…</div>
    <div class="teams-grid" id="teamsGrid"></div>
</div>
<script>
const SB='https://xgyskiatppgaeaamjhxr.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhneXNraWF0cHBnYWVhYW1qaHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTgxNTQsImV4cCI6MjA4NjA3NDE1NH0.67KCcUWlJij-scDoCUvZpkiCle5-mHVmy-inRk96Tac';
const SESSION_KEY='lbma_admin_session';
const ALLOWED=['coach','admin','superadmin'];
const COLORS={AIGLES:'#4A90D9',CONDORS:'#E67E22',DUCS:'#8E44AD',FAUCONS:'#27AE60',HARFANGS:'#C0392B',VAUTOURS:'#F39C12'};
let session=null,allData={},timer=null;

function checkSession(){
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw){window.location.href='login.html';return false;}
    try{session=JSON.parse(raw);}catch(e){window.location.href='login.html';return false;}
    if(session.expires<Date.now()){localStorage.removeItem(SESSION_KEY);window.location.href='login.html';return false;}
    if(!session.remember&&!sessionStorage.getItem('lbma_session_alive')){localStorage.removeItem(SESSION_KEY);window.location.href='login.html';return false;}
    if(!session.remember)sessionStorage.setItem('lbma_session_alive','1');
    if(!ALLOWED.includes(session.role)){alert('Accès refusé — réservé aux coachs et administrateurs.');window.location.href='index.html';return false;}
    return true;
}

async function sbGet(path){
    const r=await fetch(SB+'/rest/v1/'+path,{headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Range':'0-9999'}});
    if(!r.ok)throw new Error(await r.text());
    return r.json();
}

async function init(){
    if(!checkSession())return;
    document.getElementById('userBadge').textContent=(session.nom||session.user)+' ('+session.role+(session.equipe?' — '+session.equipe:'')+')';
    try{
        const s=await sbGet('frappeurs_saison?select=saison&order=saison.desc&limit=5000');
        const u=[...new Set(s.map(x=>x.saison))];
        const sel=document.getElementById('saisonSel');
        sel.innerHTML=u.map(x=>'<option value="'+x+'">'+x+'</option>').join('');
        try{const si=await sbGet('saison_info?cle=eq.saison_active&select=valeur&limit=1');const a=si[0]?.valeur;if(a){const o=sel.querySelector('option[value="'+a+'"]');if(o)o.selected=true;}}catch(e){}
    }catch(e){document.getElementById('saisonSel').innerHTML='<option value="2026">2026</option>';}
    await loadData();
    clearInterval(timer);timer=setInterval(loadData,120000);
}

async function loadData(){
    const saison=document.getElementById('saisonSel').value;
    if(!saison)return;
    document.getElementById('loadingDiv').style.display='block';
    document.getElementById('teamsGrid').innerHTML='';
    document.getElementById('alertBar').style.display='none';
    try{
        // Matchs réguliers ET séries finalisés
        const [matchsReg, matchsSer] = await Promise.all([
            sbGet('matchs_regulier?saison=eq.'+saison+'&status=eq.final&select=id'),
            sbGet('matchs_series?saison=eq.'+saison+'&select=id').catch(()=>[])
        ]);
        const ids=[...matchsReg.map(m=>m.id),...matchsSer.map(m=>m.id)];
        const roster=await sbGet('equipes_saison?saison=eq.'+saison+'&select=joueur_nom,equipe&equipe=neq.AUTRE&order=equipe.asc,joueur_nom.asc');
        let pf=[];
        if(ids.length>0){
            for(let i=0;i<ids.length;i+=50){
                const chunk=ids.slice(i,i+50);
                const rows=await sbGet('pointage_frappeurs?match_id=in.('+chunk.join(',')+')'+'&select=joueur,equipe,off,def');
                pf=pf.concat(rows);
            }
        }
        const ot={};roster.forEach(r=>{ot[r.joueur_nom]=r.equipe;});
        const bm={};
        roster.forEach(r=>{bm[r.equipe+'|'+r.joueur_nom]={nom:r.joueur_nom,equipe:r.equipe,off:0,def:0};});
        pf.forEach(row=>{
            if(!ot[row.joueur]||ot[row.joueur]!==row.equipe)return;
            const k=row.equipe+'|'+row.joueur;if(!bm[k])return;
            if(row.off===true)bm[k].off++;if(row.def===true)bm[k].def++;
        });
        allData={};
        Object.values(bm).forEach(p=>{if(!allData[p.equipe])allData[p.equipe]=[];allData[p.equipe].push({...p,bench:p.off+p.def});});
        Object.keys(allData).forEach(eq=>{allData[eq].sort((a,b)=>b.bench-a.bench||a.nom.localeCompare(b.nom));});
        const eqSel=document.getElementById('equipeSel');
        const prev=eqSel.value;
        eqSel.innerHTML='<option value="all">Toutes les équipes</option>'+Object.keys(allData).sort().map(e=>'<option value="'+e+'">'+e+'</option>').join('');
        if(prev&&eqSel.querySelector('option[value="'+prev+'"]'))eqSel.value=prev;
        else if(session?.equipe&&eqSel.querySelector('option[value="'+session.equipe+'"]'))eqSel.value=session.equipe;
        document.getElementById('lastUpdate').textContent='Mis à jour : '+new Date().toLocaleTimeString('fr-CA');
    }catch(e){
        document.getElementById('teamsGrid').innerHTML='<div class="loading">❌ Erreur : '+e.message+'</div>';
    }finally{document.getElementById('loadingDiv').style.display='none';}
    renderAll();
}

function renderAll(){
    const grid=document.getElementById('teamsGrid');
    const filter=document.getElementById('equipeSel').value;
    const alerts=[];grid.innerHTML='';
    Object.keys(allData).sort().forEach(eq=>{
        if(filter!=='all'&&filter!==eq)return;
        const players=allData[eq];if(!players||players.length===0)return;
        const minB=Math.min(...players.map(p=>p.bench));
        const maxB=Math.max(...players.map(p=>p.bench));
        const ecart=maxB-minB;
        const color=COLORS[eq]||'#888';
        const isMyTeam=session?.equipe===eq;
        if(ecart>1){
            const top=players.filter(p=>p.bench===maxB).map(p=>p.nom).join(', ');
            const bot=players.filter(p=>p.bench===minB).map(p=>p.nom).join(', ');
            alerts.push('<strong>'+eq+'</strong> — Écart '+ecart+' : '+top+' ('+maxB+'×) vs '+bot+' ('+minB+'×)');
        }
        const rows=players.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+p.nom+'</td><td>'+p.off+'</td><td>'+p.def+'</td><td><div class="bench-bar-wrap"><span class="bench-total">'+p.bench+'</span><div class="bench-dots">'+buildDots(p.off,p.def)+'</div></div></td><td>'+getPill(p.bench,minB,maxB)+'</td></tr>').join('');
        const ab=ecart>1?'<div class="team-alert-bar" style="display:block">⚠️ Écart de '+ecart+' — À corriger (max 1 permis par règlement)</div>':'';
        grid.innerHTML+='<div class="team-card'+(isMyTeam?' my-team':'')+'"><div class="team-header" style="border-left:5px solid '+color+'"><h2 style="color:'+color+'">'+eq+'</h2><span class="team-meta">'+players.length+' joueurs · max '+maxB+'× · min '+minB+'×</span></div>'+ab+'<table class="bench-table"><thead><tr><th>#</th><th>Joueur</th><th>OFF</th><th>DEF</th><th>Total</th><th>Statut</th></tr></thead><tbody>'+rows+'</tbody></table><div class="legend"><span class="leg-item"><span class="dot off"></span>&nbsp;OFF (bâton seul)</span><span class="leg-item"><span class="dot def"></span>&nbsp;DEF (défense seule)</span></div></div>';
    });
    const ab=document.getElementById('alertBar');
    if(alerts.length>0){document.getElementById('alertList').innerHTML=alerts.map(a=>'<li>'+a+'</li>').join('');ab.style.display='block';}
    if(grid.innerHTML==='')grid.innerHTML='<div class="loading">Aucune donnée disponible.</div>';
}

function getPill(b,mn,mx){
    if(mn===mx)return '<span class="pill pill-green">Égal</span>';
    if(b===mx)return '<span class="pill pill-red">Le plus benché</span>';
    if(b===mn)return '<span class="pill pill-green">Le moins benché</span>';
    return '<span class="pill pill-yellow">Intermédiaire</span>';
}
function buildDots(off,def){
    let h='';for(let i=0;i<off;i++)h+='<span class="dot off" title="OFF"></span>';for(let i=0;i<def;i++)h+='<span class="dot def" title="DEF"></span>';return h;
}
init();
</script>
</body>
</html>
