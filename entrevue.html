<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrevue - LBMA</title>
    <script src="assets/js/lbma-saison.js"></script>
    <link rel="icon" type="image/jpeg" href="logo-lbma.jpg">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,sans-serif}
        /* ===== Une entrevue (lue dans medias_entrevues) ===== */
        .page-header{margin-top:80px}
        .page-header .ent-par{font-size:.9rem!important;margin-top:.35rem}
        .container{max-width:820px;margin:0 auto;padding:1.25rem}
        .ent-texte{background:var(--a-surface);border:1px solid var(--a-ligne);border-radius:var(--a-rayon);padding:1.5rem 1.6rem;color:#22324A;font-size:1.02rem;line-height:1.65}
        .ent-texte>*+*{margin-top:.85rem}
        html.lbma-theme .ent-texte h2,html.lbma-theme .ent-texte h3,html.lbma-theme .ent-texte h4{color:var(--a-encre);letter-spacing:0;line-height:1.2}
        html.lbma-theme .ent-texte h2{font-size:1.35rem}
        html.lbma-theme .ent-texte h3{font-size:1.15rem;margin-top:1.3rem}
        .ent-texte p.question{font-weight:700;color:var(--a-encre)}
        .ent-texte ul,.ent-texte ol{padding-left:1.3rem}
        .ent-texte a{color:#1F5FA8}
        .ent-texte blockquote{border-left:3px solid var(--a-ligne);padding-left:1rem;color:var(--a-gris)}
        .ent-nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
        .ent-retour{display:inline-flex;align-items:center;min-height:44px;padding:0 1rem;border-radius:999px;border:1px solid var(--a-ligne);background:var(--a-surface);color:var(--a-encre);text-decoration:none;font-weight:600;font-size:.9rem}
        .ent-retour.fonce{background:var(--a-encre);color:#fff;border-color:var(--a-encre)}
        .ent-vide{color:var(--a-gris)}
        @media(max-width:820px){.ent-texte{padding:1rem 1rem;font-size:1rem}}
    </style>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
    <link rel="stylesheet" href="assets/css/lbma-theme.css">
    <script>document.documentElement.classList.add('lbma-theme')</script>
</head>
<body>
    <nav id="lbma-nav-root"></nav>

    <div class="page-header">
        <h1 id="entNom">Entrevue</h1>
        <p id="entSous"></p>
        <p class="ent-par">Par Jean-Christian Dionne</p>
    </div>

    <div class="container">
        <article class="ent-texte" id="entTexte"><p class="ent-vide">Chargement de l'entrevue…</p></article>
        <div class="ent-nav">
            <a href="entrevues.html" class="ent-retour fonce">← Toutes les entrevues</a>
            <a href="revue-presse.html" class="ent-retour">Médias et entrevues</a>
        </div>
    </div>

    <footer><span class="lbma-annee"></span></footer>

    <script src="assets/js/sb-client.js"></script>
    <script src="assets/js/lbma-entrevues.js"></script>
    <script>
    (function () {
        var E = window.LBMA_ENTREVUES;
        var slug = new URLSearchParams(location.search).get('e') || '';
        // Ancienne page de secours, seulement pour un identifiant simple (jamais une adresse externe)
        var archive = /^[a-z0-9_-]+$/i.test(slug) ? E.ARCHIVE + slug + '.html' : 'entrevues.html';

        if (!slug) { location.replace('entrevues.html'); return; }

        sbFetch('medias_entrevues?select=nom,categorie,sous_titre,contenu&visible=eq.true&slug=eq.' + encodeURIComponent(slug) + '&limit=1')
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function (rows) {
                var e = rows[0];
                if (!e) { location.replace('entrevues.html'); return; }   // masquée ou inconnue
                document.title = 'Entrevue avec ' + e.nom + ' - LBMA';
                document.getElementById('entNom').textContent = 'Entrevue avec ' + e.nom;
                document.getElementById('entSous').textContent = e.sous_titre ||
                    (e.categorie === 'legende' ? 'Joueur légendaire de la LBMA' : 'Joueur actuel de la LBMA');
                document.getElementById('entTexte').innerHTML = E.nettoyer(e.contenu) || '<p class="ent-vide">Texte à venir.</p>';
            })
            .catch(function () { location.replace(archive); });   // base indisponible : ancienne page
    })();
    </script>
    <script src="lbma-analytics.js"></script>
    <script src="assets/js/lbma-nav.js"></script>
</body>
</html>
