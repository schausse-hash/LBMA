<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Connexion Admin - LBMA</title>
    <link rel="icon" type="image/jpeg" href="logo-lbma.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#1E3A5F;--accent:#CC0000;--gold:#D4AF37;--white:#FDFBF7;--cream:#F5F1E8;--dark:#1A1A1A;--success:#28a745;--danger:#dc3545}
        body{font-family:'Work Sans',sans-serif;background:linear-gradient(135deg,var(--primary) 0%,#0d2137 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
        .login-container{width:100%;max-width:450px}
        .login-header{text-align:center;margin-bottom:2rem}
        .login-header img{height:100px;background:white;padding:10px;border-radius:10px;margin-bottom:1rem}
        .login-header h1{font-family:'Bebas Neue',sans-serif;color:var(--white);font-size:2.5rem;letter-spacing:.1em}
        .login-header p{color:rgba(255,255,255,.7);margin-top:.5rem}
        .login-box{background:var(--white);border:3px solid var(--gold);padding:2.5rem}
        .login-box h2{font-family:'Oswald',sans-serif;color:var(--primary);text-align:center;margin-bottom:2rem;font-size:1.5rem}
        .form-group{margin-bottom:1.5rem}
        .form-group label{display:block;font-family:'Oswald',sans-serif;color:var(--primary);margin-bottom:.5rem;font-size:.9rem;text-transform:uppercase}
        .form-group input{width:100%;padding:1rem;border:2px solid var(--dark);font-size:1rem;transition:.3s}
        .form-group input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,58,95,.2)}
        .form-group .input-icon{position:relative}
        .form-group .input-icon input{padding-left:3rem}
        .form-group .input-icon span{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1.2rem}
        .btn{width:100%;padding:1rem;font-family:'Oswald',sans-serif;font-size:1.1rem;text-transform:uppercase;border:none;cursor:pointer;transition:.3s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:#2D5A8A;transform:translateY(-2px)}
        .error-msg{background:#ffe6e6;border:2px solid var(--danger);color:var(--danger);padding:1rem;margin-bottom:1rem;text-align:center;display:none}
        .error-msg.show{display:block}
        .login-footer{text-align:center;margin-top:2rem}
        .login-footer a{color:rgba(255,255,255,.7);text-decoration:none;font-size:.9rem}
        .login-footer a:hover{color:var(--gold)}
        .remember-me{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem}
        .remember-me input{width:auto}
        .remember-me label{font-size:.9rem;color:#666;cursor:pointer}
        .admin-list{background:var(--cream);padding:1rem;margin-top:1.5rem;border:2px solid var(--dark)}
        .admin-list h4{font-family:'Oswald',sans-serif;color:var(--primary);margin-bottom:.5rem;font-size:.9rem}
        .admin-list p{font-size:.8rem;color:#666}
        .caps-warning{color:var(--danger);font-size:.8rem;margin-top:.5rem;display:none}
        .caps-warning.show{display:block}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="logo-lbma.jpg" alt="LBMA">
            <h1>🔐 ESPACE ADMIN</h1>
            <p>Ligue de Balle Molle Amicale</p>
        </div>

        <div class="login-box">
            <h2>Connexion Administrateur</h2>
            
            <div id="errorMsg" class="error-msg">
                ❌ Nom d'utilisateur ou mot de passe incorrect
            </div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <div class="input-icon">
                        <span>👤</span>
                        <input type="text" id="username" placeholder="Entrez votre nom d'utilisateur" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="input-icon">
                        <span>🔑</span>
                        <input type="password" id="password" placeholder="Entrez votre mot de passe" required autocomplete="current-password" onkeyup="checkCapsLock(event)">
                    </div>
                    <div id="capsWarning" class="caps-warning">⚠️ Verr Maj est activé</div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Rester connecté</label>
                </div>

                <button type="submit" class="btn btn-primary">🔓 Se Connecter</button>
            </form>

            <div class="admin-list">
                <h4>📋 Administrateurs autorisés:</h4>
                <p>Contactez le responsable de la ligue si vous avez besoin d'un accès.</p>
                <p style="margin-top:.5rem"><a href="#" onclick="forgotPassword(); return false;" style="color:var(--primary);font-size:.85rem">🔑 Mot de passe oublié?</a></p>
            </div>
        </div>

        <div class="login-footer">
            <a href="index.html">← Retour au site public</a>
        </div>
    </div>

    <script>
        // ========================================
        // ADMIN CREDENTIALS — SUPABASE
        // ========================================
        const SB_URL = 'https://xgyskiatppgaeaamjhxr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhneXNraWF0cHBnYWVhYW1qaHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0OTgxNTQsImV4cCI6MjA4NjA3NDE1NH0.67KCcUWlJij-scDoCUvZpkiCle5-mHVmy-inRk96Tac';
        const SESSION_KEY = 'lbma_admin_session';
        const SESSION_ALIVE = 'lbma_session_alive'; // sessionStorage — meurt à la fermeture du navigateur
        const SESSION_DURATION = 24 * 60 * 60 * 1000;

        async function sbFetch(path, opts = {}) {
            const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
                ...opts,
                headers: {
                    'apikey': SB_KEY,
                    'Authorization': `Bearer ${SB_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation',
                    ...(opts.headers || {})
                }
            });
            return res;
        }

        // Get redirect URL from query params
        function getRedirect() {
            const params = new URLSearchParams(window.location.search);
            return params.get('redirect') || params.get('retour') || '';
        }

        // Decide where to go after login
        function getDestination(role) {
            const redirect = getRedirect();
            // Si un redirect/retour est spécifié (ex: pointage.html?id=1), y aller
            if (redirect) return decodeURIComponent(redirect);
            // Tout le monde va au panneau admin par défaut
            return 'admin.html';
        }

        // Check if already logged in
        function checkSession() {
            const session = localStorage.getItem(SESSION_KEY);
            if (session) {
                try {
                    const data = JSON.parse(session);
                    // Session expirée?
                    if (data.expires <= Date.now()) {
                        localStorage.removeItem(SESSION_KEY);
                        return false;
                    }
                    // Si "Rester connecté" n'était PAS coché, vérifier le heartbeat
                    // sessionStorage meurt quand le navigateur/onglet ferme
                    if (!data.remember && !sessionStorage.getItem(SESSION_ALIVE)) {
                        localStorage.removeItem(SESSION_KEY);
                        return false;
                    }
                    window.location.href = getDestination(data.role);
                    return true;
                } catch (e) {
                    localStorage.removeItem(SESSION_KEY);
                }
            }
            return false;
        }

        // Handle login — vérification via Supabase
        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.toLowerCase().trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const btn = document.querySelector('button[type="submit"]');
            
            btn.disabled = true;
            btn.textContent = '⏳ Connexion...';

            try {
                // Chercher l'utilisateur dans Supabase
               const res = await fetch(`${SB_URL}/rest/v1/rpc/login_user`, {
    method: 'POST',
    headers: {
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`,
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        p_username: username,
        p_password: password,
        p_remember: remember
    })
});
                
                if (!res.ok) throw new Error('Erreur serveur');
                
                const users = await res.json();
                
                if (users.length > 0) {
                    const user = users[0];
                    const session = {
                        user: user.username,
                        role: user.role,
                        nom: user.nom,
                        equipe: user.equipe || '',
                        remember: remember,
                        // Jeton de session emis par la base : exige par les fonctions
                        // sensibles (comptes, mots de passe, export du schema).
                        token: user.token || '',
                        loginTime: Date.now(),
                        expires: user.expires_at ? new Date(user.expires_at).getTime()
                               : (remember ? Date.now() + (7 * SESSION_DURATION) : Date.now() + SESSION_DURATION)
                    };
                    
                    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
                    // Heartbeat: si pas "rester connecté", la session meurt avec le navigateur
                    if (!remember) sessionStorage.setItem(SESSION_ALIVE, '1');
                    window.location.href = getDestination(user.role);
                } else {
                    // Login failed
                    document.getElementById('errorMsg').classList.add('show');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                    setTimeout(() => {
                        document.getElementById('errorMsg').classList.remove('show');
                    }, 5000);
                }
            } catch (err) {
                console.error('Erreur login:', err);
                document.getElementById('errorMsg').innerHTML = '❌ Erreur de connexion au serveur. Réessayez.';
                document.getElementById('errorMsg').classList.add('show');
                setTimeout(() => {
                    document.getElementById('errorMsg').classList.remove('show');
                    document.getElementById('errorMsg').innerHTML = '❌ Nom d\'utilisateur ou mot de passe incorrect';
                }, 5000);
            } finally {
                btn.disabled = false;
                btn.textContent = '🔓 Se Connecter';
            }
            
            return false;
        }

        // Mot de passe oublie
        // Securite (sept. 2026) : l'ancienne version permettait a n'importe qui de
        // changer le mot de passe de n'importe quel compte en connaissant seulement
        // le nom d'utilisateur. La reinitialisation passe maintenant par un superadmin
        // (Admin > Utilisateurs > modifier le compte).
        function forgotPassword() {
            alert('Pour réinitialiser ton mot de passe, contacte un super administrateur de la LBMA.\n\nIl pourra te donner un nouveau mot de passe temporaire depuis l\'administration.');
        }

        // Check Caps Lock
        function checkCapsLock(e) {
            const capsWarning = document.getElementById('capsWarning');
            if (e.getModifierState && e.getModifierState('CapsLock')) {
                capsWarning.classList.add('show');
            } else {
                capsWarning.classList.remove('show');
            }
        }

        // Check session on page load
        checkSession();
    </script>
</body>
</html>
